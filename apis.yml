aid: nqoodlet
name: Nqoodlet
description: >-
  Nqoodlet is a Saudi Arabia-based (Riyadh) corporate spend and expense management
  platform for businesses from SMEs to enterprises. It lets teams issue unlimited
  virtual and physical company cards, track every transaction in real time, manage
  and control cards from a single dashboard, and pay globally in local currency
  without conversion fees. Over 600 companies use Nqoodlet to streamline expense
  management, eliminate paperwork, and gain clearer visibility into company
  spending. It is backed by 500 Global. Nqoodlet does not currently publish a
  public developer API, developer portal, SDKs, or API documentation; this profile
  captures the company's public web identity plus a live domain-security probe.
